      <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700&display=swap" rel="stylesheet">

      <style>
          body {
              margin: 0;
          //background-color: #000;
          //color: #fff;
              font-family: "Nunito", sans-serif;
              font-size: 13px;
              line-height: 24px;
          }

          a {
              color: #ff0;
              text-decoration: none;
          }

          a:hover {
              text-decoration: underline;
          }

          button {
              cursor: pointer;
              text-transform: uppercase;
          }

          canvas {
              display: block;
          }


          section{
              position:absolute;;
              top:0;
              left:0;
              display:flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              margin:1rem;
              width: 30vw;
              min-width:200px;
              height:20vh;
              color:#fff;
          // background: orange;

          }

          article{
              position:relative;
              width:100%;
              height:100%;
              display:flex;

              flex-direction: column;;
              justify-content: center;
              align-items: center;
              background: rgba(0,0,0,.45);

          }

          h2{
              margin:8px 0;
          }
          span{
              font-weight:100;
          }

          div.gear{
              position:relative;
              width:50px;
              height:50px;
              opacity:.7;
              background: url("//holdrr.com/spyne/icon-gear.png") no-repeat;
              background-size:contain;
          }




      </style>
  </head>
  <body>

  <main id="app">
      <section id="text">


      </section>


  </main>
