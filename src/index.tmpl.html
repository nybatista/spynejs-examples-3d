<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>spyne example app</title>
  <meta name="description" content="basic spyne appllication">
<!--
      <link rel="stylesheet"  href="//assetscontainer.com/starter-app/css/main.css"/>
-->
      <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700&display=swap" rel="stylesheet">

      <style>
          body {
              margin: 0;
          //background-color: #000;
          //color: #fff;
              font-family: "Nunito", sans-serif;
              font-size: 14px;
              line-height: 120%;
          }



          h2{
              font-size:1.5rem;
          }

          @media screen and (max-width: 600px) {
              html {
                  font-size:10px;
              }
          }

          a {
              color: #ff0;
              text-decoration: none;
          }

          a:hover {
              text-decoration: underline;
          }

          button {
              cursor: pointer;
              text-transform: uppercase;
          }

          canvas {
              display: block;
          }


          section{
              position:absolute;;
              top:10px;
              left:10px;
              display:flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding:10px 20px;
              width: 35vw;
              min-width:200px;
              height:30vh;
              color:#fff;
          // background: orange;


          }

          article{
              position:absolute;
              width:100%;
              height:100%;
              display:flex;

              flex-direction: column;;
              align-items: center;
              background: #3A7263;
/*
              background: rgba(0,0,0,.45);
*/

          }

          h2{
              margin:8px 0;
          }
          span{
              font-weight:100;
          }

          div.content{
              position: relative;
              width: 100%;
              height: 100%;
              padding-top: 10px;
              display: flex;
              flex-direction: column;
              align-items: center;
          }


          header.icon{
              position:relative;
              width:50px;
              height:50px;
              opacity:.7;
          }

          header.icon.front{
              background: url("//holdrr.com/spyne/icons/front-scooter.png") no-repeat;
              background-size:contain;
          }
          header.icon.left{
              background: url("//holdrr.com/spyne/icons/left-scooter.png") no-repeat;
              background-size:contain;
          }
          header.icon.right{
              background: url("//holdrr.com/spyne/icons/right-scooter.png") no-repeat;
              background-size:contain;
          }
          header.icon.back{
              background: url("//holdrr.com/spyne/icons/back-scooter.png") no-repeat;
              background-size:contain;
          }




      </style>
  </head>
  <body>

  <main id="app">


  </main>
  <script src="//assetscontainer.com/threejs/r102/build/three.min.js"></script>

  <script src="//assetscontainer.com/threejs/r102/examples/js/libs/inflate.min.js"></script>
  <script src="//assetscontainer.com/threejs/r102/examples/js/loaders/FBXLoader.js"></script>

  <script src="//assetscontainer.com/threejs/r102/examples/js/controls/OrbitControls.js"></script>

  <script src="//assetscontainer.com/threejs/r102/examples/js/WebGL.js"></script>


  <script id="callout-item" type="template">
        <div class="content">
            <header class="icon {{classStr}}"></header>
          <h2>{{title}}</h2>
            <ul>
                {{#items}}
                <li>{{.*}}</li>
                {{/items}}

            </ul>
        </div>


  </script>
  </body>
</html>
